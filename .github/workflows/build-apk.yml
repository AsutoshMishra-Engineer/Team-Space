name: Build TeamSpace Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile TeamSpace Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: 🔨 Compile Android APK
        shell: bash
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeamSpace-Android-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.1-android
          name: "TeamSpace Android App v1.0.1 (Optimized)"
          generate_release_notes: false
          body: |
            ### 🚀 TeamSpace Android App v1.0.1 — Optimized Mobile Release

            This update resolves mobile viewport text overlapping and optimizes push notification status for Android devices.

            - **App Name:** TeamSpace
            - **Version:** `1.0.1` (Build 2)
            - **Package:** `com.teamspace.app`
            - **Key Improvements:**
              - 📱 Native 1:1 mobile viewport rendering (no text overlaps or cramped flex containers).
              - 🔤 Normalized font scaling across all Android device display settings.
              - 🔔 Direct Google Firebase Cloud Messaging native status bridge (no "browser unsupported" warnings).
              - ⚡ Edge-accelerated with instant Swipe-to-Refresh.
            
            #### 📲 Installation:
            1. Download `app-debug.apk` below directly to your phone.
            2. Tap to install (updates existing TeamSpace app seamlessly).
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
